/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java project to get you started.
 * For more details take a look at the Java Quickstart chapter in the Gradle
 * User Manual available at https://docs.gradle.org/5.6.3/userguide/tutorial_java_projects.html
 */
plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building a CLI application
    id 'application'

    id 'jacoco'
}
version = '1.0'
repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation 'com.google.guava:guava:28.0-jre'
    implementation 'org.processing:core:3.3.7'
    // implementation 'org.reflections:reflections:0.10.2'

    // Use JUnit Jupiter API for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'

    // Use JUnit Jupiter Engine for testing.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

application {
    // Define the main class for the application
    getMainClass().set('Tanks.App')
}

test {
    // Use junit platform for unit tests
    useJUnitPlatform()
    ignoreFailures = false
    testLogging {
        events 'started', 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            println "TEST SUMMARY: ${result.testCount} tests, ${result.successfulTestCount} passed, " +
                "${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'Tanks.App'
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

// Compile UTF-8 source files consistently on Windows and other platforms.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Keep source and bytecode compatible with Java 8.
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// Generate machine-readable coverage for a one-command acceptance report.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Stage 9: check Java 8 platform APIs when compiling on JDK 9 or newer.
// On JDK 8, sourceCompatibility/targetCompatibility already select Java 8.
tasks.withType(JavaCompile).configureEach {
    if (JavaVersion.current().majorVersion.toInteger() >= 9) {
        options.release.set(8)
    }
}

// Consistent UTF-8 Javadoc generation on Windows.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}
